{"name":"Deploy TIMONEY Web to Vercel","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"jobs":{"deploy":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"subosito/flutter-action@v2","with":{"channel":"stable"}},{"name":"Enable web","run":"flutter config --enable-web"},{"name":"Install deps","run":"flutter pub get"},{"name":"Build web","run":"flutter build web --release"},{"uses":"actions/setup-node@v4","with":{"node-version":"20"}},{"name":"Install Vercel CLI","run":"npm i -g vercel"},{"name":"Pull Vercel env","run":"vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}","env":{"VERCEL_ORG_ID":"${{ secrets.VERCEL_ORG_ID }}","VERCEL_PROJECT_ID":"${{ secrets.VERCEL_PROJECT_ID }}"}},{"name":"Deploy build/web to Vercel","run":"vercel deploy build/web --prod --yes --token=${{ secrets.VERCEL_TOKEN }}","env":{"VERCEL_ORG_ID":"${{ secrets.VERCEL_ORG_ID }}","VERCEL_PROJECT_ID":"${{ secrets.VERCEL_PROJECT_ID }}"}}]}}}